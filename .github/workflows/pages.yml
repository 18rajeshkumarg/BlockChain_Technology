name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            hardhat-lock/package-lock.json
            reactdemo/myreactapp/package-lock.json

      - name: Install Hardhat dependencies
        run: npm ci --prefix hardhat-lock

      - name: Test contracts
        run: npm test --prefix hardhat-lock

      - name: Install React dependencies
        run: npm ci --prefix reactdemo/myreactapp

      - name: Build React app
        run: npm run build --prefix reactdemo/myreactapp

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reactdemo/myreactapp/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4